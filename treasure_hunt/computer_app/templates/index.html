<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Hunt Dashboard — Full Version</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.4rem; color: #f0c040; flex: 1; }
    .badge {
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .badge-ok  { background: #1a4731; color: #3fb950; border: 1px solid #3fb950; }
    .badge-err { background: #4c1616; color: #f85149; border: 1px solid #f85149; }
    .header-btn {
      padding: 0.4rem 1rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: transparent;
      color: #e6edf3;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
    }
    .header-btn:hover { background: #21262d; }
    .reset-btn {
      padding: 0.4rem 1rem;
      border-radius: 8px;
      border: 1px solid #f85149;
      background: transparent;
      color: #f85149;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .reset-btn:hover { background: #4c1616; }

    /* ── Main grid ── */
    main {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 0.8rem;
    }

    /* ── Hunter card ── */
    .hunter-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .hunter-card.claiming {
      border-color: #e3912a;
      box-shadow: 0 0 12px rgba(227,145,42,0.4);
    }
    .hunter-card.found {
      border-color: #3fb950;
      box-shadow: 0 0 12px rgba(63,185,80,0.3);
    }
    .hunter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .hunter-name { font-size: 1rem; font-weight: 700; color: #f0c040; }
    .hunter-label {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
    }
    .label-hot  { background: #3fb950; color: #0d1117; }
    .label-warm { background: #e3912a; color: #0d1117; }
    .label-cold { background: #1c2128; color: #8b949e; }
    .label-found { background: #f0c040; color: #0d1117; }

    .prox-bar-wrap {
      height: 10px;
      background: #21262d;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }
    .prox-bar {
      height: 100%;
      border-radius: 5px;
      transition: width 0.4s, background 0.4s;
      background: #3fb950;
    }
    .hunter-meta {
      font-size: 0.78rem;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
    }

    /* ── Treasure card ── */
    .treasure-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
      transition: border-color 0.5s, box-shadow 0.5s;
    }
    .treasure-card.found {
      border-color: #f0c040;
      box-shadow: 0 0 18px rgba(240,192,64,0.4);
    }
    .treasure-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .treasure-name { font-size: 1rem; font-weight: 700; color: #f0c040; }
    .found-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.2rem 0.7rem;
      border-radius: 6px;
      background: #f0c040;
      color: #0d1117;
    }
    .treasure-info { font-size: 0.8rem; color: #8b949e; margin-top: 0.4rem; }
    .treasure-info span { color: #e6edf3; }

    .signal-bar-wrap {
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .signal-bar {
      height: 100%;
      border-radius: 3px;
      background: #58a6ff;
      transition: width 0.4s;
    }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: #8b949e;
    }
    .empty a { color: #f0c040; }

    /* ── Game-over overlay ── */
    #game-over-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 100;
      align-items: center;
      justify-content: center;
      animation: goFadeIn 0.4s ease;
    }
    #game-over-overlay.visible { display: flex; }
    @keyframes goFadeIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    .go-card {
      background: #161b22;
      border: 2px solid #f0c040;
      border-radius: 16px;
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 0 60px rgba(240,192,64,0.25);
    }
    .go-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f0c040;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }
    .go-subtitle {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 1.8rem;
    }
    .go-winner-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b949e;
      margin-bottom: 0.3rem;
    }
    .go-winner-name {
      font-size: 2.4rem;
      font-weight: 900;
      color: #f0c040;
      margin-bottom: 1.8rem;
    }
    .go-leaderboard {
      list-style: none;
      margin-bottom: 2rem;
      text-align: left;
    }
    .go-leaderboard li {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.95rem;
    }
    .go-leaderboard li:last-child { border-bottom: none; }
    .go-rank {
      width: 1.4rem;
      text-align: right;
      font-size: 0.78rem;
      color: #8b949e;
    }
    .go-hunter { flex: 1; font-weight: 700; color: #e6edf3; }
    .go-finds  { font-size: 0.85rem; color: #8b949e; }
    .go-finds span { color: #f0c040; font-weight: 700; }
    .go-reset-btn {
      padding: 0.6rem 1.8rem;
      border-radius: 10px;
      border: 1px solid #f85149;
      background: transparent;
      color: #f85149;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    .go-reset-btn:hover { background: #4c1616; }
  </style>
</head>
<body>

<header>
  <h1>🏴 Treasure Hunt <small style="font-size:0.75rem;color:#8b949e;font-weight:400">— Full Version (up to 8 hunters · 5 treasures)</small></h1>
  <span class="badge badge-err" id="serial-badge">● Disconnected</span>
  {% if use_reachy %}
  <span class="badge" id="reachy-badge" style="background:#1a2740;color:#58a6ff;border:1px solid #58a6ff">🤖 Reachy …</span>
  {% endif %}
  <a class="header-btn" href="/setup">⚙ Setup</a>
  <button class="reset-btn" id="reset-btn">↺ Reset Session</button>
</header>

<main>
  <!-- Hunter column -->
  <div id="hunters-col">
    <div class="section-title">Hunters</div>
    <div id="hunters-grid"></div>
  </div>

  <!-- Treasure column -->
  <div id="treasures-col">
    <div class="section-title">Treasures</div>
    <div id="treasures-grid"></div>
  </div>
</main>

<!-- Game-over overlay (hidden until all treasures found) -->
<div id="game-over-overlay" role="dialog" aria-modal="true" aria-labelledby="go-title">
  <div class="go-card">
    <div class="go-title" id="go-title">ALL TREASURES FOUND!</div>
    <div class="go-subtitle" id="go-subtitle"></div>
    <div class="go-winner-label">Winner</div>
    <div class="go-winner-name" id="go-winner">—</div>
    <ol class="go-leaderboard" id="go-leaderboard"></ol>
    <button class="go-reset-btn" id="go-reset-btn">↺ Reset / Play Again</button>
  </div>
</div>

<!-- Inject server-side config as JS globals -->
<script>
  window.RSSI_HOT       = {{ rssi_hot }};
  window.RSSI_WARM      = {{ rssi_warm }};
  window.ACTIVE_HUNTERS   = {{ active_hunters | tojson }};
  window.ACTIVE_TREASURES = {{ active_treasures | tojson }};
  window.USE_REACHY       = {{ 'true' if use_reachy else 'false' }};
</script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
